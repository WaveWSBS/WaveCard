name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: os_trace decoder tests
        run: |
          xcrun clang -fobjc-arc -framework Foundation tests/test_os_trace.m -o /tmp/test_os_trace
          /tmp/test_os_trace

      - name: card hash scanner tests
        run: |
          swiftc -O -parse-as-library tests/test_card_hash_scanner.swift Sources/Swift/CardHashScanner.swift -o /tmp/test_card_hash_scanner
          /tmp/test_card_hash_scanner

      - name: card exporter tests
        run: |
          swiftc -O -parse-as-library tests/test_card_exporter.swift Sources/Swift/CardExporter.swift -o /tmp/test_card_exporter
          /tmp/test_card_exporter

  build:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg (styled DMG)
        run: brew install create-dmg

      - name: Build universal app + DMG
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WaveCard-dmg
          path: build/WaveCard.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "WaveCard $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" build/WaveCard.dmg --clobber
